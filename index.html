<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<title>SMIS 午餐 · Cezars Kitchen</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="SMIS 午餐">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root { --cardw: 86%; }
  @media (min-width: 620px) { :root { --cardw: calc(50% - 5px); } }
  @media (min-width: 940px) { :root { --cardw: calc(33.333% - 7px); } }
  * { -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #FFF7E6; }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

  button:focus-visible, textarea:focus-visible { outline: 2px solid #F2A900; outline-offset: 2px; }
  textarea:focus { border-color: #F2A900 !important; }
  .sheet-wrap { align-items: flex-end; }
  .sheet { border-radius: 18px 18px 0 0; max-height: 88vh; }
  @media (min-width: 620px) {
    .sheet-wrap { align-items: center; padding: 24px; box-sizing: border-box; }
    .sheet { border-radius: 16px; max-height: 82vh; box-shadow: 0 18px 50px rgba(58,42,18,.25); }
  }

</style>
